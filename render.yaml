services:
  - type: web
    name: ai-code-review-assistant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: false
      - key: RELOAD
        value: false
    healthCheckPath: /
    autoDeploy: true
